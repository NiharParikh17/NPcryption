name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          pyproject_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init_version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/npcryption/__init__.py)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=$tag_version pyproject=$pyproject_version __init__=$init_version"
          if [ "$tag_version" != "$pyproject_version" ] || [ "$tag_version" != "$init_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version in pyproject.toml and src/npcryption/__init__.py"
            exit 1
          fi
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check --strict dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
