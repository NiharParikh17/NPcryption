name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  # github.workflow is the caller's name when run from release.yml, so a
  # release's CI never cancels (or is cancelled by) the regular CI run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install flake8
        run: python -m pip install flake8
      - name: Run flake8
        run: flake8 src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Run tests
        run: pytest -v

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check --strict dist/*
      - name: Smoke-test the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -c "from npcryption import encrypt, decrypt; assert decrypt(17, 19, 5, encrypt(17, 19, 5, 'Hello')) == 'Hello'"
          printf 'E\n17\n19\n5\nHello\n' | npcryption | tee cli-output.txt
          grep -q '021271109109042$' cli-output.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
