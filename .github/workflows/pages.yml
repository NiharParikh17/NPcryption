name: Pages

# Publishes web/ to GitHub Pages: https://niharparikh17.github.io/NPcryption/
# The demo runs the npcryption wheel built from the same commit in the browser,
# so library changes redeploy the site too.
on:
  push:
    branches: [main]
    paths:
      - web/**
      - src/**
      - pyproject.toml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the npcryption wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r web/. _site/
          cp dist/*.whl _site/npcryption.whl
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
